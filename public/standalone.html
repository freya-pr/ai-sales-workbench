<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>在线咨询 - AI课程顾问</title>
    <meta name="description" content="3-6岁学龄前家庭教育课程在线咨询" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f8fafc; }
      iframe { width: 100%; height: 100%; border: 0; display: block; }
      .loader {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 12px; color: #0891b2; font-size: 14px;
      }
      .spin { width: 32px; height: 32px; border: 3px solid #cffafe; border-top-color: #0891b2; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="loader" class="loader">
      <div class="spin"></div>
      <div>正在连接顾问...</div>
    </div>
    <iframe
      id="chat"
      title="在线咨询"
      allow="clipboard-write"
      style="display:none"
    ></iframe>
    <script>
      (function () {
        // 默认指向 Vercel 生产环境；如需自定义，改这里或在 URL 上加 ?api=
        var FALLBACK_BASE = 'https://ai-sales-workbench-liart.vercel.app';
        var params = new URLSearchParams(window.location.search);
        var base = params.get('api') || FALLBACK_BASE;
        var name = params.get('name') || '';
        var phone = params.get('phone') || '';
        var ref = params.get('ref') || 'standalone';
        var title = params.get('title') || '课程顾问';
        var color = params.get('color') || '#0891b2';

        var target = base + '/widget?auto=1&ref=' + encodeURIComponent(ref);
        if (name) target += '&name=' + encodeURIComponent(name);
        if (phone) target += '&phone=' + encodeURIComponent(phone);
        if (title) target += '&title=' + encodeURIComponent(title);
        if (color) target += '&color=' + encodeURIComponent(color);

        var f = document.getElementById('chat');
        f.src = target;
        f.onload = function () {
          document.getElementById('loader').style.display = 'none';
          f.style.display = 'block';
        };
      })();
    </script>
  </body>
</html>
